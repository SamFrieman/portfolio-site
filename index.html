<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root{
  --bg:#030b18;--s1:#061423;--s2:#091d34;
  --cyan:#00d4ff;--cyan2:rgba(0,212,255,.08);--cyan3:rgba(0,212,255,.04);
  --red:#ff3e6c;--green:#00ff8a;--purple:#8b5cf6;--amber:#f59e0b;
  --sky:#38bdf8;--pink:#e879f9;--gold:#f59e0b;
  --text:#cce4f0;--muted:#5a8aaa;--subtle:#1e3a54;
  --border:rgba(0,212,255,.12);--border-hi:rgba(0,212,255,.28);
  --glow:0 0 40px rgba(0,212,255,.18);
  --glow-sm:0 0 16px rgba(0,212,255,.14);
  --glow-lg:0 0 72px rgba(0,212,255,.22);
  --shadow-card:0 4px 24px rgba(0,0,0,.4),0 1px 0 rgba(0,212,255,.06);
  --sp-1:8px;--sp-2:16px;--sp-3:24px;--sp-4:32px;--sp-5:48px;--sp-6:64px;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --transition-base:.22s var(--ease-out);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:16px;line-height:1.6;
  overflow-x:hidden;cursor:none;
}
/* ─ Layered background ─ */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 55% at 50% -5%,rgba(0,212,255,.055) 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 85% 70%,rgba(139,92,246,.04) 0%,transparent 55%),
    linear-gradient(rgba(0,212,255,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,.016) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,56px 56px,56px 56px;
}
/* Grain texture overlay */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  opacity:.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:200px 200px;
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:4px}

h1,h2,h3,h4{font-family:'Orbitron',monospace;letter-spacing:.05em}
.mono{font-family:'JetBrains Mono',monospace}
section{position:relative;z-index:2}
.container{max-width:1140px;margin:0 auto;padding:0 24px}
.sp{padding:120px 0}

/* ─ Section label ─ */
.sl{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);
  margin-bottom:14px;position:relative;
}
.sl::before{content:'';display:block;width:28px;height:1px;background:linear-gradient(90deg,var(--cyan),rgba(0,212,255,.3))}
.sl::after{content:'';display:block;width:8px;height:8px;border:1px solid var(--cyan);border-radius:50%;margin-left:-4px;box-shadow:0 0 6px var(--cyan)}

/* ─ Section title ─ */
.st{
  font-size:clamp(28px,4vw,44px);font-weight:900;
  background:linear-gradient(135deg,#fff 0%,rgba(200,230,240,.85) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.08;margin-bottom:16px;
}
.ss{color:var(--muted);font-size:16px;max-width:500px;line-height:1.7}

/* ─ Ghost section number ─ */
.ghost{
  position:absolute;right:0;top:40%;
  font-family:'Orbitron',monospace;font-size:clamp(80px,14vw,200px);font-weight:900;
  color:transparent;-webkit-text-stroke:1px rgba(0,212,255,.032);
  pointer-events:none;user-select:none;line-height:1;z-index:0;letter-spacing:-.02em;
}

/* ─ Tags ─ */
.tag{
  display:inline-block;padding:4px 12px;border:1px solid var(--border);border-radius:100px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);
  background:rgba(0,212,255,.06);white-space:nowrap;transition:border-color .2s,background .2s,box-shadow .2s;
}
.tag:hover{border-color:var(--cyan);background:rgba(0,212,255,.14);box-shadow:0 0 8px rgba(0,212,255,.2)}

/* ─ Buttons ─ */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 26px;min-height:44px;font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:none;border-radius:4px;cursor:none;text-decoration:none;
  transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),background .22s;
}
.bp{
  background:linear-gradient(135deg,#00d4ff,#0099cc);color:#030b18;
  box-shadow:0 0 28px rgba(0,212,255,.4),0 4px 16px rgba(0,0,0,.3);
  font-weight:800;letter-spacing:.14em;position:relative;overflow:hidden;
}
.bp::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .2s}
.bp:hover::after{opacity:1}
.bp:hover{box-shadow:0 0 40px rgba(0,212,255,.6),0 6px 20px rgba(0,0,0,.4);transform:translateY(-1px)}
.bo{
  background:rgba(0,212,255,.06);color:var(--cyan);border:1px solid rgba(0,212,255,.35);
  font-weight:700;letter-spacing:.12em;
}
.bo:hover{background:rgba(0,212,255,.14);border-color:var(--cyan);box-shadow:0 0 20px rgba(0,212,255,.2);transform:translateY(-1px)}

/* ─ Status dot ─ */
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pdot 2s ease infinite;display:inline-block}
@keyframes pdot{0%,100%{box-shadow:0 0 8px var(--green)}50%{box-shadow:0 0 22px var(--green),0 0 6px rgba(0,255,138,.4)}}

/* ─ Ticker ─ */
.twrap{
  overflow:hidden;border-top:1px solid rgba(0,212,255,.08);border-bottom:1px solid rgba(0,212,255,.08);
  background:rgba(0,0,0,.35);padding:10px 0;position:relative;
}
.twrap::before,.twrap::after{content:'';position:absolute;top:0;bottom:0;width:80px;z-index:1;pointer-events:none}
.twrap::before{left:0;background:linear-gradient(90deg,rgba(3,11,24,1),transparent)}
.twrap::after{right:0;background:linear-gradient(270deg,rgba(3,11,24,1),transparent)}
.ttrack{display:flex;width:max-content;animation:tick 52s linear infinite;contain:layout style;will-change:transform}
.twrap:hover .ttrack{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 28px;display:inline-flex;align-items:center;gap:8px}
.ti span{color:var(--cyan);font-weight:700}
.ti::before{content:'·';color:rgba(0,212,255,.25);margin-right:4px}

/* ─ Marquee ─ */
.mwrap{overflow:hidden;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mtrack{display:flex;width:max-content;animation:marq 30s linear infinite;contain:layout style;will-change:transform}
.mtrack.rev{animation-direction:reverse;animation-duration:36s}
.mwrap:hover .mtrack{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mi{
  font-family:'Orbitron',monospace;font-size:clamp(15px,2.3vw,26px);font-weight:900;
  letter-spacing:.08em;padding:0 36px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:0;position:relative;
}
.mi-inner{color:transparent;-webkit-text-stroke:1px rgba(0,212,255,.3);transition:color .22s,-webkit-text-stroke .22s,text-shadow .22s}
.mi:hover .mi-inner{color:var(--mic,var(--cyan));-webkit-text-stroke:1px var(--mic,var(--cyan));text-shadow:0 0 20px rgba(0,212,255,.6)}
.mi::before{content:'◈';margin-right:16px;color:rgba(0,212,255,.25);font-size:.6em;transition:color .22s}
.mi:hover::before{color:var(--mic,var(--cyan))}

/* ─ Navbar ─ */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .4s,backdrop-filter .4s,border-bottom .4s}
.nav.sc{background:rgba(3,11,24,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1140px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nl{
  font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--cyan);
  text-decoration:none;cursor:none;position:relative;letter-spacing:.06em;
}
.nl::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),rgba(0,212,255,.2));transform:scaleX(0);transition:transform .3s;transform-origin:left}
.nl:hover::after{transform:scaleX(1)}
.nlinks{display:flex;gap:28px;list-style:none}
.nlinks a{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;transition:color .2s;cursor:none;
  position:relative;padding-bottom:2px;
}
.nlinks a::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--cyan);transform:scaleX(0);transition:transform .25s;transform-origin:left}
.nlinks a:hover,.nlinks a.act{color:var(--cyan)}
.nlinks a:hover::after,.nlinks a.act::after{transform:scaleX(1)}
.ns{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
/* Hamburger menu */
.hambtn{display:none;flex-direction:column;gap:5px;cursor:none;padding:11px;min-width:44px;min-height:44px;align-items:center;justify-content:center;background:transparent;border:none;z-index:110}
.hamline{width:22px;height:2px;background:var(--cyan);border-radius:2px;transition:transform .28s var(--ease-out),opacity .28s}
.hambtn.open .hamline:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hambtn.open .hamline:nth-child(2){opacity:0;transform:scaleX(0)}
.hambtn.open .hamline:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobmenu{
  position:fixed;top:64px;left:0;right:0;background:rgba(3,11,24,.97);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:20px 24px;z-index:99;display:flex;flex-direction:column;gap:4px;
  transform:translateY(-110%);transition:transform .4s var(--ease-out);pointer-events:none;
}
.mobmenu.open{transform:translateY(0);pointer-events:auto}
.mobmenu a{
  font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;padding:14px 0;
  border-bottom:1px solid var(--border);transition:color .2s;cursor:none;
}
.mobmenu a:last-child{border-bottom:none}
.mobmenu a:hover,.mobmenu a.act{color:var(--cyan)}

@media(max-width:760px){.nlinks{display:none}.hambtn{display:flex}}
@media(max-width:900px){.sidep{display:none}}

/* ─ Side progress dots ─ */
.sidep{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:50}
.spd{
  width:8px;height:8px;border-radius:50%;
  border:1px solid var(--muted);background:transparent;
  cursor:none;transition:transform .3s var(--ease-out),background .3s,border-color .3s,box-shadow .3s;
  text-decoration:none;display:block;
}
.spd.act{
  background:var(--cyan);border-color:var(--cyan);
  box-shadow:0 0 8px var(--cyan),0 0 16px rgba(0,212,255,.3);
  transform:scale(1.55);
}
.spd:hover:not(.act){
  border-color:rgba(0,212,255,.6);background:rgba(0,212,255,.2);
  transform:scale(1.4);
}

/* ─ Scroll progress bar ─ */
.sbar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));z-index:200;transform-origin:left}

/* ─ Divider ─ */
.divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent)}

/* ═══════════════════════════════════════════
   HERO
═══════════════════════════════════════════ */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#hc{position:absolute;inset:0;z-index:0;pointer-events:none}
.hcontent{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:0 24px;padding-top:80px;padding-bottom:60px}
.hkicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:10px;margin-bottom:20px}
.hname{font-family:'Orbitron',monospace;font-size:clamp(48px,8vw,104px);font-weight:900;line-height:.92;color:#fff;margin-bottom:22px}
/* htype as paragraph, not motion.p which loses semantics */
.htype{font-family:'JetBrains Mono',monospace;font-size:clamp(14px,2.3vw,21px);color:var(--muted);margin-bottom:38px;min-height:2em}
.cblink{display:inline-block;width:2px;height:1.05em;background:var(--cyan);margin-left:4px;animation:cb .8s step-end infinite;vertical-align:middle}
@keyframes cb{0%,100%{opacity:1}50%{opacity:0}}
.hctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px}

/* Availability badge */
.avail-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 16px;border:1px solid rgba(0,255,138,.25);border-radius:100px;
  background:rgba(0,255,138,.07);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--green);
  margin-bottom:32px;
}
.avail-badge .dot{width:6px;height:6px}

/* Glitch effect */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;font:inherit;color:inherit;will-change:clip-path,transform;backface-visibility:hidden}
.glitch::before{color:var(--cyan);animation:gb 4.5s infinite}
.glitch::after{color:var(--red);animation:ga 4.5s infinite}
@keyframes gb{0%,90%,100%{clip-path:inset(100% 0 0 0);transform:none}92%{clip-path:inset(18% 0 68% 0);transform:translate(-5px,-2px)}94%{clip-path:inset(52% 0 18% 0);transform:translate(5px,2px)}96%{clip-path:inset(4% 0 84% 0);transform:translate(-3px)}}
@keyframes ga{0%,90%,100%{clip-path:inset(100% 0 0 0);transform:none}91%{clip-path:inset(72% 0 4% 0);transform:translate(5px,-2px)}93%{clip-path:inset(28% 0 52% 0);transform:translate(-5px,2px)}95%{clip-path:inset(82% 0 4% 0);transform:translate(3px)}}

/* Scroll indicator */
.sa{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:7px;
  pointer-events:none;z-index:2;
}
.sarr{width:1px;height:32px;background:linear-gradient(180deg,var(--cyan),transparent);animation:ad 1.8s ease-in-out infinite}
@keyframes ad{0%{opacity:0;transform:scaleY(0);transform-origin:top}50%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1);transform-origin:bottom}}

/* ═══════════════════════════════════════════
   STATS
═══════════════════════════════════════════ */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.scard{
  background:linear-gradient(135deg,rgba(6,20,35,.97),rgba(9,29,52,.96));
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:24px 16px;text-align:center;cursor:none;
  transition:border-color .25s var(--ease-out),box-shadow .25s,transform .3s var(--ease-out);
  position:relative;overflow:hidden;
}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.4),transparent);opacity:0;transition:opacity .3s}
.scard:hover{border-color:var(--border-hi);box-shadow:var(--shadow-card),var(--glow-sm);transform:translateY(-4px)}
.scard:hover::before{opacity:1}
.snum{font-family:'Orbitron',monospace;font-size:40px;font-weight:900;color:var(--cyan);line-height:1;margin-bottom:5px;text-shadow:0 0 24px rgba(0,212,255,.25)}
.slab{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ═══════════════════════════════════════════
   TIMELINE
═══════════════════════════════════════════ */
.tl{position:relative;padding-left:30px;border-left:1px solid rgba(0,212,255,.18)}
.tli{position:relative;margin-bottom:48px}
.tldot{position:absolute;left:-38px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);border:2px solid var(--bg)}
.tldate{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:5px}
.tltitle{font-family:'Orbitron',monospace;font-size:17px;font-weight:700;color:#fff;margin-bottom:3px}
.tlco{font-size:14px;color:var(--muted);margin-bottom:12px}
.tlb{list-style:none;display:flex;flex-direction:column;gap:8px}
.tlb li{font-size:14px;color:var(--text);line-height:1.65;padding-left:16px;position:relative}
.tlb li::before{content:'▸';position:absolute;left:0;color:var(--cyan);font-size:11px;top:3px}

/* ═══════════════════════════════════════════
   PROJECTS
═══════════════════════════════════════════ */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:24px;align-items:start}
.pc{
  background:linear-gradient(160deg,rgba(6,20,35,.95),rgba(9,29,52,.9));
  border:1px solid var(--border);border-radius:var(--r-lg);
  position:relative;overflow:hidden;cursor:none;
  transition:border-color .3s,box-shadow .3s,transform .3s;
}
.pc:hover{transform:translateY(-4px)}
.pc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;z-index:1}
.ph{padding:26px 26px 0}
.ptabs{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:18px}
.ptab{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 18px;min-height:44px;cursor:none;color:var(--muted);border:none;background:transparent;
  flex:1;text-align:center;position:relative;transition:color .2s,background .2s;
}
.ptab.act{color:var(--cyan);background:rgba(0,212,255,.05)}
.ptab.act::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.ptab:not(.act):hover{color:var(--text);background:rgba(0,212,255,.03)}
.pbody{padding:22px;min-height:200px;max-height:none}
.cpre{
  background:rgba(0,0,0,.6);border-left:3px solid var(--cyan);
  border-radius:0 5px 5px 0;padding:16px 18px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.9;
  overflow-x:auto;margin:0;white-space:pre;color:var(--text);
  /* Scrollbar for code blocks */
  scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.3) transparent;
}
.cpre::-webkit-scrollbar{height:3px}
.cpre::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.cpre .ck{color:#c084fc}.cpre .cf{color:#22d3ee}.cpre .cs{color:#86efac}.cpre .cc{color:#4d7a96}.cpre .cn{color:#fb923c}
.plink{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;min-height:38px;border-radius:4px;border:1px solid var(--border);
  color:var(--muted);transition:all .22s var(--ease-out);cursor:none;margin-top:16px;
}
.plink:hover{color:var(--cyan);border-color:var(--cyan);background:var(--cyan2)}

/* ═══════════════════════════════════════════
   SKILLS
═══════════════════════════════════════════ */
.swrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
@media(max-width:760px){.swrap{grid-template-columns:1fr}}
.sbar-row{display:flex;flex-direction:column;gap:16px}
.sbar-hdr{display:flex;justify-content:space-between;margin-bottom:6px;cursor:none}
.sbar-name{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.sbar-track{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;box-shadow:0 0 8px rgba(0,212,255,.3)}

/* ═══════════════════════════════════════════
   CERTS
═══════════════════════════════════════════ */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px}
.ccard{
  background:linear-gradient(135deg,rgba(6,20,35,.98),rgba(9,29,52,.97));
  border:1px solid var(--border);border-radius:var(--r-md);
  padding:18px;display:flex;flex-direction:column;gap:6px;
  cursor:none;transition:border-color .25s var(--ease-out),transform .25s var(--ease-out),box-shadow .25s;
}
.ccard:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:var(--shadow-card)}
.cert-icon{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;margin-bottom:4px;
  font-family:'Orbitron',monospace;font-size:10px;font-weight:900;letter-spacing:.06em;
}

/* ═══════════════════════════════════════════
   CTF
═══════════════════════════════════════════ */
.ctfrow{display:flex;flex-direction:column;gap:9px}
.ctfc{
  background:linear-gradient(135deg,rgba(6,20,35,.9),rgba(9,29,52,.8));
  border:1px solid var(--border);border-radius:var(--r-md);
  padding:18px 22px;display:flex;align-items:center;gap:18px;
  position:relative;overflow:hidden;cursor:none;
  transition:border-color .25s var(--ease-out),transform .3s var(--ease-out),box-shadow .25s;
}
.ctfc:hover{border-color:var(--cyan);transform:translateX(6px);box-shadow:var(--glow-sm)}
.ctfrank{
  font-family:'Orbitron',monospace;font-size:24px;font-weight:900;
  min-width:72px;text-align:center;
}
.ctfscan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,212,255,.07),transparent);transform:translateX(-100%)}
.ctf-badge{
  padding:4px 12px;min-height:28px;display:inline-flex;align-items:center;border-radius:100px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid;margin-left:auto;flex-shrink:0;
}

/* ═══════════════════════════════════════════
   OSINT TERMINAL
═══════════════════════════════════════════ */
.oterm-wrap{padding:120px 0;position:relative;z-index:2;background:var(--bg)}
.oterm-shell{max-width:820px;margin:0 auto;padding:0}
.oterm-window{
  border-radius:10px;overflow:hidden;
  border:1px solid rgba(0,212,255,.2);
  box-shadow:0 0 80px rgba(0,212,255,.08),0 24px 64px rgba(0,0,0,.5);
}
.oterm-bar{
  display:flex;align-items:center;gap:8px;padding:11px 16px;
  background:rgba(8,18,32,.97);border-bottom:1px solid rgba(0,212,255,.12);
}
.oterm-dot{width:12px;height:12px;border-radius:50%}
.oterm-title{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(0,212,255,.5);
  margin-left:8px;flex:1;text-align:center;letter-spacing:.06em;
}
.oterm-body{
  background:rgba(3,9,20,.98);padding:18px 20px;height:380px;overflow-y:auto;
  display:flex;flex-direction:column;gap:0;
  font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;letter-spacing:.01em;
  scroll-behavior:smooth;
  /* PERF: isolate terminal repaints from rest of page */
  contain:layout style;
}
.oterm-body::-webkit-scrollbar{width:3px}
.oterm-body::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:3px}
.oterm-body::-webkit-scrollbar-track{background:transparent}
.oterm-line{display:flex;gap:0;flex-wrap:wrap}
.oterm-prompt{color:var(--cyan);white-space:nowrap;margin-right:4px}
.oterm-cmd{color:#fff}
.oterm-out{color:#94a3b8;padding-left:0;display:block;white-space:pre-wrap;font-size:12px;line-height:1.75}
.oterm-out.ok{color:#4ade80}
.oterm-out.warn{color:var(--amber)}
.oterm-out.err{color:#f87171}
.oterm-out.data{color:#93c5fd}
.oterm-out.hi{color:var(--cyan);font-weight:600}
.oterm-out.muted{color:#475569;font-style:italic}
.oterm-input-row{display:flex;align-items:center;gap:0;margin-top:4px;position:sticky;bottom:0;background:rgba(3,9,20,.98);padding-top:4px}
.oterm-input{background:transparent;border:none;outline:none;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;flex:1;caret-color:var(--cyan);cursor:text!important}
.oterm-cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);animation:cur .85s step-end infinite;vertical-align:middle;margin-left:1px}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.oterm-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding:0 2px}
.oterm-pill{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;
  padding:8px 14px;min-height:36px;border:1px solid rgba(0,212,255,.18);border-radius:100px;
  color:rgba(0,212,255,.6);background:rgba(0,212,255,.04);cursor:none;
  transition:all .2s var(--ease-out);white-space:nowrap;line-height:1.5;
  display:inline-flex;align-items:center;
}
.oterm-pill:hover{border-color:rgba(0,212,255,.5);color:var(--cyan);background:rgba(0,212,255,.09);box-shadow:0 0 14px rgba(0,212,255,.12)}

/* ═══════════════════════════════════════════
   CONTACT
═══════════════════════════════════════════ */
.ci{text-align:center;max-width:620px;margin:0 auto}
.clinks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:36px}
.copy-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:transparent;border:1px solid var(--border);
  border-radius:4px;padding:8px 14px;min-height:36px;cursor:none;transition:all .2s var(--ease-out);margin-top:10px;
}
.copy-btn:hover{color:var(--cyan);border-color:var(--cyan);background:rgba(0,212,255,.05)}
.avail-card{
  display:inline-flex;align-items:center;gap:12px;
  padding:14px 24px;border:1px solid rgba(0,255,138,.2);border-radius:10px;
  background:rgba(0,255,138,.05);margin-bottom:36px;
}

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
footer{
  border-top:1px solid rgba(0,212,255,.08);padding:40px 24px 28px;
  text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;
  color:var(--muted);position:relative;z-index:2;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.3));
}
.foot-status{
  display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  color:rgba(0,212,255,.18);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin-top:12px;
}
.foot-status span{display:flex;align-items:center;gap:6px}
/* ds = status dot used in footer */
.ds{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pdot 2s ease infinite;flex-shrink:0}
.foot-status .ds{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

/* ═══════════════════════════════════════════
   LOADER
═══════════════════════════════════════════ */
.loader{position:fixed;inset:0;z-index:9999;background:#030b18;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.hwrap{position:relative;width:120px;height:120px;margin-bottom:28px;flex-shrink:0}
.hsvg{position:absolute;inset:0}
.hcore{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,.5)}
.twind{width:min(560px,93vw);background:rgba(6,20,35,.97);border:1px solid rgba(0,212,255,.22);border-radius:8px;overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);padding:9px 14px;border-bottom:1px solid rgba(0,212,255,.1)}
.tb{width:11px;height:11px;border-radius:50%}
.tb.r{background:#ff5f57}.tb.y{background:#febc2e}.tb.g{background:#28c840}
.ttitle{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-left:8px}
.tbody{padding:16px 20px;min-height:220px;max-height:280px;overflow:hidden}
.tline{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.85;white-space:pre-wrap;word-break:break-all}
.tp{color:var(--cyan)}.tok{color:var(--green)}.twarn{color:var(--amber)}.tout{color:#94a3b8}.tfin{color:var(--green);font-weight:700}
.lpwrap{width:min(560px,93vw);margin-top:18px}
.lphdr{display:flex;justify-content:space-between;margin-bottom:7px}
.lplbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.lppct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan)}
.lptr{width:100%;height:3px;background:rgba(0,212,255,.1);border-radius:2px;overflow:hidden}
.lpfill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:2px;transition:width .14s linear}
.sweep{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,212,255,.04) 50%,transparent);animation:sw 2.5s ease-in-out infinite;will-change:transform}
@keyframes sw{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}

/* ─ Architecture diagram tab body needs no extra padding ─ */
.pbody-arch{padding:16px 20px;min-height:200px}
.arch-svg{width:100%;height:auto;overflow:visible;display:block}

/* ─ Back to top ─ */
.btt{
  position:fixed;bottom:28px;right:24px;width:44px;height:44px;
  border-radius:50%;background:rgba(6,20,35,.95);
  border:1px solid var(--border);color:var(--cyan);
  display:flex;align-items:center;justify-content:center;
  cursor:none;z-index:50;transition:border-color .25s var(--ease-out),box-shadow .25s,transform .25s var(--ease-out);text-decoration:none;
  font-size:16px;
}
.btt:hover{border-color:var(--cyan);box-shadow:var(--glow-sm);transform:translateY(-3px)}

/* ─ Orb decoration ─ */
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(80px);z-index:1}

/* ─ Screen reader only utility ─ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}

/* ─ Focus-visible: keyboard navigation accessibility ─ */
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--cyan);outline-offset:3px;
  box-shadow:0 0 0 4px rgba(0,212,255,.18);
  border-radius:var(--r-sm);
}
a:focus-visible,button:focus-visible{border-radius:4px}

/* ─ Contact section subtitle centering ─ */
.ci .ss{text-align:center;margin:0 auto}

/* ─ Touch device cursor fix ─ */
@media(pointer:coarse){
  *,*::before,*::after{cursor:auto!important}
  a,button,.btn,.ptab,.oterm-pill,.copy-btn,.hambtn,.spd,.ccard,.scard,.ctfc,.plink{cursor:pointer!important}
}

/* ─ Hero mobile improvements ─ */
@media(max-width:480px){
  .hname{font-size:clamp(40px,13vw,80px)}
  .hctas{flex-direction:column;align-items:flex-start}
  .hctas .btn{width:100%;justify-content:center}
}

/* ─ Section padding: mobile reduction ─ */
@media(max-width:768px){.sp{padding:72px 0}}
@media(max-width:480px){.sp{padding:52px 0}}

/* ─ Skills panel responsive ─ */
@media(max-width:720px){
  .skills-panel-grid{grid-template-columns:1fr!important}
}
/* ─ Improved mobile skill bars ─ */
@media(max-width:480px){
  .sbar-hdr{flex-wrap:wrap;gap:4px}
}

/* ─ CTF cards: prevent horizontal overflow on mobile ─ */
@media(max-width:560px){
  .ctfc{flex-wrap:wrap;gap:12px}
  .ctfrank{min-width:unset;font-size:20px}
  .ctf-badge{margin-left:0}
}

/* ─ Footer link hover color ─ */
footer a{text-decoration:none;transition:color .2s}
footer a:hover{color:var(--cyan)}

/* ─ Reduced motion: respect system preferences ─ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .ttrack{animation:tick 52s linear infinite!important}
  .mtrack{animation:marq 30s linear infinite!important}
  .mtrack.rev{animation:marq 36s linear infinite reverse!important}
  .cblink,.cblink{animation:none!important}
  html{scroll-behavior:auto}
}

/* ─ Skip to content (accessibility — hidden until focused) ─ */
.skip-link{
  position:fixed;top:-120px;left:16px;z-index:9999;
  background:var(--cyan);color:#030b18;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:10px 20px;border-radius:4px;text-decoration:none;
  transition:top .2s var(--ease-out);
  pointer-events:none;opacity:0;
}
.skip-link:focus{top:16px;pointer-events:auto;opacity:1}

/* ─ Typewriter hook ─ */
function useTW(phrases,speed=60,pause=1900){
  const[d,setD]=useState('');const[i,setI]=useState(0);const[del,setDel]=useState(false);
  useEffect(()=>{const p=phrases[i];if(!del){if(d.length<p.length){const t=setTimeout(()=>setD(p.slice(0,d.length+1)),speed);return()=>clearTimeout(t);}const t=setTimeout(()=>setDel(true),pause);return()=>clearTimeout(t);}else{if(d.length>0){const t=setTimeout(()=>setD(d.slice(0,-1)),speed/2);return()=>clearTimeout(t);}setDel(false);setI((i+1)%phrases.length);}},[ d,del,i]);return d;
}

/* ─ Count-up hook ─ */
function useCount(target,dec=0,dur=1.8){
  const[c,setC]=useState(0);const ref=useRef(null);const iv=useInView(ref,{once:true});
  useEffect(()=>{if(!iv)return;let st=null;function s(ts){if(!st)st=ts;const p=Math.min((ts-st)/(dur*1000),1);const e=1-Math.pow(1-p,3);setC(+(e*target).toFixed(dec));if(p<1)requestAnimationFrame(s);else setC(target);}requestAnimationFrame(s);},[iv,target,dec,dur]);
  return{c,ref};
}

/* ─ Scramble text hook ─ */
function useScramble(text,trigger){
  const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#∆≠■□';const[d,setD]=useState('');const fr=useRef(null);
  useEffect(()=>{if(!trigger){setD('');return;}let it=0;clearInterval(fr.current);fr.current=setInterval(()=>{setD(text.split('').map((c,i)=>{if(c===' ')return c;if(i<it)return text[i];return CH[Math.floor(Math.random()*CH.length)];}).join(''));it+=.4;if(it>=text.length){setD(text);clearInterval(fr.current);}},36);return()=>clearInterval(fr.current);},[trigger,text]);
  return trigger?(d||text):'';
}

/* ─ Shared active section state — avoids creating 12 IntersectionObservers
   (Navbar and SideP previously each created 6 independent observers for the same sections).
   Now both components read from one shared subscription. ─ */
const NAV_IDS=['about','experience','projects','skills','achievements','contact'];
let _actSubs=[];let _actVal=NAV_IDS[0];
function _notifyActSubs(id){_actVal=id;_actSubs.forEach(fn=>fn(id));}
let _actObservers=null;
function _ensureActObservers(){
  if(_actObservers)return;
  _actObservers=NAV_IDS.map(id=>{
    const el=document.getElementById(id);if(!el)return null;
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting)_notifyActSubs(id);},{rootMargin:'-35% 0px -35% 0px',threshold:0});
    o.observe(el);return o;
  });
}
/* Shared hook — subscribes to the ONE set of observers */
function useActiveSection(){
  const[act,setAct]=useState(_actVal);
  useEffect(()=>{
    _ensureActObservers();
    _actSubs.push(setAct);
    return()=>{_actSubs=_actSubs.filter(fn=>fn!==setAct);};
  },[]);
  return act;
}

/* ─ Syntax highlighter — memoized (line content is static code strings) ─ */
const SHL=React.memo(function SHL({line}){
  if(line.trimStart().startsWith('#'))return<div><span className="cc">{line}</span></div>;
  const KW=['async ','await ','def ','class ','return ','import ','from ','if ','else:','for ','in ','List','str','int','bool'];
  const parts=[];let i=0;
  while(i<line.length){
    if(line[i]==='"'||line[i]==="'"){const q=line[i];let j=i+1;while(j<line.length&&line[j]!==q)j++;parts.push(<span key={i} className="cs">{line.slice(i,j+1)}</span>);i=j+1;continue;}
    let kw=false;for(const k of KW){if(line.slice(i).startsWith(k)){parts.push(<span key={i} className="ck">{k}</span>);i+=k.length;kw=true;break;}}if(kw)continue;
    const fn=line.slice(i).match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/);if(fn){parts.push(<span key={i} className="cf">{fn[1]}</span>);i+=fn[1].length;continue;}
    const nm=line.slice(i).match(/^\d+\.?\d*/);if(nm&&(i===0||!/[a-zA-Z_]/.test(line[i-1]))){parts.push(<span key={i} className="cn">{nm[0]}</span>);i+=nm[0].length;continue;}
    parts.push(line[i]);i++;
  }
  return<div>{parts}</div>;
});

const PCard=React.memo(function PCard({p,i}){
  const[tab,setTab]=useState('overview');
  const mx=useMotionValue(0),my=useMotionValue(0);
  const rx=useSpring(useTransform(my,[-60,60],[5,-5]),{stiffness:200,damping:20});
  const ry=useSpring(useTransform(mx,[-60,60],[-5,5]),{stiffness:200,damping:20});
  const tabLabels={overview:'Project overview',architecture:'Architecture diagram',code:'Source code'};
  /* PERF: React.memo prevents re-render when parent re-renders (e.g. tab switches elsewhere) */
  return(
    <motion.article className="pc" aria-label={`Project: ${p.title}`}
      style={{rotateX:rx,rotateY:ry,transformPerspective:900,transformStyle:'preserve-3d',
        /* BUGFIX: merged second style prop here — previously the tilt (rotateX/Y) was silently
           overwritten by {borderColor,boxShadow} because JSX merges the LAST style prop only */
        borderColor:'rgba(0,212,255,.12)',boxShadow:'none'
      }}

/* ─ OSINT Terminal ─ */
function OsintTerminal(){
  const[history,setHistory]=useState(()=>[{cmd:'help',output:(TERM_COMMANDS.help&&TERM_COMMANDS.help.run())||[]}]);
  const[inputVal,setInputVal]=useState('');
  const[isRunning,setIsRunning]=useState(false);
  const[cmdHistory,setCmdHistory]=useState([]);
  const[histIdx,setHistIdx]=useState(-1);
  const bodyRef=useRef(null);
  const inputRef=useRef(null);
  const lockRef=useRef(false);

  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;},[history]);
  /* PERF: useCallback prevents focusInput from being a new function reference on every render */
  const focusInput=useCallback(()=>{if(inputRef.current&&!isRunning)inputRef.current.focus();},[isRunning]);

  /* PERF: useCallback — runCommand only changes when TERM_COMMANDS changes (never) */
  const runCommand=useCallback(function runCommand(rawCmd){
    if(lockRef.current)return;
    const cmd=rawCmd.trim();if(!cmd)return;
    setCmdHistory(prev=>[cmd,...prev].slice(0,50));setHistIdx(-1);setInputVal('');
    if(cmd==='clear'){setHistory([]);return;}
    lockRef.current=true;setIsRunning(true);
    const key=TERM_COMMANDS&&Object.keys(TERM_COMMANDS).find(k=>k===cmd||cmd.toLowerCase().startsWith(k.split(' ')[0].toLowerCase()));
    const matched=key?TERM_COMMANDS[key]:null;
    const output=matched?matched.run():[{t:'err',v:`bash: ${cmd}: command not found`},{t:'data',v:'Type "help" for available commands.'}];
    setTimeout(()=>{setHistory(prev=>[...prev.slice(-200),{cmd,output:output||[]}]);lockRef.current=false;setIsRunning(false);},matched?320:80);
  },[]);

  /* PERF: useCallback — onKeyDown only changes when cmdHistory/histIdx/inputVal change */
  const onKeyDown=useCallback(e=>{
    if(e.key==='Enter'){runCommand(inputVal);}
    else if(e.key==='ArrowUp'){e.preventDefault();const next=Math.min(histIdx+1,cmdHistory.length-1);setHistIdx(next);setInputVal(cmdHistory[next]||'');}
    else if(e.key==='ArrowDown'){e.preventDefault();const next=Math.max(histIdx-1,-1);setHistIdx(next);setInputVal(next===-1?'':cmdHistory[next]||'');}
    else if(e.key==='Tab'){e.preventDefault();if(!inputVal)return;const match=TERM_SORTED_CMDS.find(p=>p.startsWith(inputVal)&&p!==inputVal);if(match)setInputVal(match);}
    else if(e.key==='Escape'){e.preventDefault();setInputVal('');setHistIdx(-1);}
  },[runCommand,inputVal,histIdx,cmdHistory]);

  return(
    <section className="oterm-wrap" id="terminal" aria-labelledby="term-heading">
      <div className="container">
        <Reveal><span className="sl" aria-hidden="true">Command Line</span></Reveal>
        <Reveal delay={0.08} variants={vC}><ScrambleH2 id="term-heading" text="Command Line Simulator" className="st" style={{marginBottom:8}}/></Reveal>
        <Reveal delay={0.14} variants={vB}><p className="ss" style={{marginBottom:28}}>A simulated terminal environment. Type any command — or click a suggestion below.</p></Reveal>
        <Reveal delay={0.2}>
          <div className="oterm-pills">
            {TERM_PILLS.map(pill=>(
              <motion.button key={pill} className="oterm-pill" onClick={()=>{setInputVal(pill);setTimeout(()=>runCommand(pill),50);}} whileHover={{scale:1.04}} whileTap={{scale:.97}}>{pill}</motion.button>
            ))}
          </div>
        </Reveal>
        <motion.div className="oterm-shell" style={{marginTop:20}} initial={{opacity:0,y:32}} whileInView={{opacity:1,y:0}} viewport={{once:true,margin:'-60px'}} transition={{duration:.7,delay:.25,ease:E}}>
          <div className="oterm-window" onClick={focusInput} role="region" aria-label="Interactive security terminal simulation">
            <div className="oterm-bar">
              <span className="oterm-dot" style={{background:'#ff5f57'}}/>
              <span className="oterm-dot" style={{background:'#febc2e'}}/>
              <span className="oterm-dot" style={{background:'#28c840'}}/>
              <span className="oterm-title">sam@kali:~/portfolio — bash  [interactive simulation]</span>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'var(--green)',letterSpacing:'.1em'}}>● LIVE</span>
            </div>
            {/* ARIA: role="log" + aria-live so screen readers announce new output */}
            <div className="oterm-body" ref={bodyRef} role="log" aria-label="Terminal output" aria-live="polite" aria-relevant="additions">
              {history.map((entry,ei)=><HistoryEntry key={ei} entry={entry}/>)}
              <div className="oterm-input-row">
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,whiteSpace:'nowrap'}}>
                  <span style={{color:'#22d3ee',fontWeight:700}}>sam</span>
                  <span style={{color:'#4a8aaa'}}>@</span>
                  <span style={{color:'#22d3ee',fontWeight:700}}>kali</span>
                  <span style={{color:'#4a8aaa'}}>:</span>
                  <span style={{color:'#8b5cf6'}}>~</span>
                  <span style={{color:'#4a8aaa'}}>$ </span>
                </span>
                <input ref={inputRef} className="oterm-input" value={inputVal} onChange={e=>setInputVal(e.target.value)} onKeyDown={onKeyDown} disabled={isRunning} autoComplete="off" spellCheck={false} placeholder={isRunning?'Running...':''} aria-label="Terminal command input" />
                {!isRunning&&<span className="oterm-cursor"/>}
                {isRunning&&<motion.span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'var(--cyan)',marginLeft:8}} animate={{opacity:[1,.3,1]}} transition={{duration:.7,repeat:Infinity}}>processing...</motion.span>}
              </div>
            </div>
          </div>
        </motion.div>
        <Reveal delay={0.3}>
          <p style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'var(--muted)',marginTop:14,letterSpacing:'.1em',textAlign:'center'}}>TAB to autocomplete · ↑↓ for history · All output is simulated</p>
        </Reveal>
      </div>
    </section>
  );
}

function Loader({onDone}){
  const[bootLines]=useState(()=>buildBoot());
  const[li,setLi]=useState(0);const[lt,setLt]=useState('');const[pct,setPct]=useState(0);const[exit,setExit]=useState(false);
  useEffect(()=>{const cap=setTimeout(()=>{setPct(100);setLi(bootLines.length);},8000);return()=>clearTimeout(cap);},[bootLines.length]);
  const hexPath=(r,cx=60,cy=60)=>{const pts=Array.from({length:6},(_,i)=>{const a=(Math.PI/180)*(60*i-30);return`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`;});return`M${pts.join('L')}Z`;};
  // Typing effect — drive li/lt forward
  useEffect(()=>{
    if(li>=bootLines.length)return;
    const line=bootLines[li].text;
    if(lt.length<line.length){
      const t=setTimeout(()=>setLt(line.slice(0,lt.length+1)),bootLines[li].type==='prompt'?8:4);
      return()=>clearTimeout(t);
    }
    const t=setTimeout(()=>{setLi(i=>i+1);setLt('');},bootLines[li].type==='prompt'?60:30);
    return()=>clearTimeout(t);
  },[li,lt,bootLines]);
  // Progress bar — crawls up while typing, then snaps to 100 and exits
  useEffect(()=>{
    if(li>=bootLines.length){
      // All lines done: fill bar to 100 then exit
      if(pct<100){const t=setTimeout(()=>setPct(p=>Math.min(100,p+4)),12);return()=>clearTimeout(t);}
      const t=setTimeout(()=>setExit(true),300);return()=>clearTimeout(t);

    const tgt=Math.min(98,Math.round((li/bootLines.length)*100));
    if(pct<tgt){const t=setTimeout(()=>setPct(p=>p+1),16);return()=>clearTimeout(t);}

            <motion.path d={hexPath(38)} fill="rgba(0,212,255,.04)" stroke="rgba(0,212,255,.35)" strokeWidth="1" animate={{opacity:[.35,1,.35]}} transition={{repeat:Infinity,duration:1.8}}/>
            <motion.path d={hexPath(30)} fill="none" stroke="rgba(139,92,246,.45)" strokeWidth="1" strokeDasharray="4 8" animate={{rotate:-360}} transition={{repeat:Infinity,duration:8,ease:'linear'}} style={{originX:'60px',originY:'60px'}}/>
            {[0,60,120,180,240,300].map(a=>{const rad=(a-30)*Math.PI/180;return <motion.circle key={a} cx={60+52*Math.cos(rad)} cy={60+52*Math.sin(rad)} r="2.5" fill="var(--cyan)" initial={{opacity:0,scale:0}} animate={{opacity:[0,1,0.7],scale:1}} transition={{delay:a/600+.8,duration:.3,repeat:Infinity,repeatDelay:2}}/>;
            })}

/* ─ Hero Canvas — memoized (sets up once, cleanup on unmount) ─ */
const HeroCanvas=React.memo(function HeroCanvas(){
  const ref=useRef(null);const pr=useReducedMotion();
  useEffect(()=>{
    /* Skip entirely on touch/mobile — saves battery + GPU */
    if(pr||window.matchMedia('(pointer:coarse)').matches||window.innerWidth<768)return;
    const canvas=ref.current,ctx=canvas.getContext('2d');
    let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
    let mouse={x:W/2,y:H/2};
    /* Fewer nodes for better perf — capped at 45 */
    const N=Math.min(45,Math.floor(W*H/28000));
    const nodes=Array.from({length:N},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
      r:Math.random()*1.4+.4,
    }));
    let scanY=0,raf,visible=true;

    /* Pause RAF when hero is off-screen */
    const io=new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible&&!raf)raf=requestAnimationFrame(draw);},{threshold:0});
    io.observe(canvas);

    /* Named listeners for correct cleanup */
    const onMM=e=>{mouse.x=e.clientX;mouse.y=e.clientY;};
    const onResize=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;};
    window.addEventListener('mousemove',onMM,{passive:true});
    window.addEventListener('resize',onResize,{passive:true});

    function draw(){
      if(!visible){raf=null;return;}
      ctx.clearRect(0,0,W,H);
      scanY=(scanY+.4)%H;
      const sg=ctx.createLinearGradient(0,scanY-60,0,scanY+60);
      sg.addColorStop(0,'transparent');sg.addColorStop(.5,'rgba(0,212,255,.025)');sg.addColorStop(1,'transparent');
      ctx.fillStyle=sg;ctx.fillRect(0,scanY-60,W,120);
      nodes.forEach(n=>{
        const dx=mouse.x-n.x,dy=mouse.y-n.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<200){n.vx+=dx/d*.011;n.vy+=dy/d*.011;}
        n.vx*=.98;n.vy*=.98;n.x+=n.vx;n.y+=n.vy;
        if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
        ctx.fillStyle='rgba(0,212,255,.45)';ctx.fill();
      });
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);
          ctx.strokeStyle=`rgba(0,212,255,${(1-d/120)*.11})`;ctx.lineWidth=.5;ctx.stroke();
        }
      }
      raf=requestAnimationFrame(draw);
    }
    raf=requestAnimationFrame(draw);
    return()=>{cancelAnimationFrame(raf);io.disconnect();window.removeEventListener('mousemove',onMM);window.removeEventListener('resize',onResize);};
  },[pr]);
  return <canvas ref={ref} id="hc"/>;
});

/* ─ Stat Card — memoized, values never change after mount ─ */
const StatCard=React.memo(function StatCard({n,s,l,d=0,delay=0}){
  const{c,ref}=useCount(n,d);
  const mx=useMotionValue(0),my=useMotionValue(0);
  const rx=useSpring(useTransform(my,[-40,40],[7,-7]),{stiffness:200,damping:20});
  const ry=useSpring(useTransform(mx,[-40,40],[-7,7]),{stiffness:200,damping:20});
  return(
    <motion.div className="scard" ref={ref} style={{rotateX:rx,rotateY:ry,transformPerspective:600}}
      onMouseMove={e=>{const r=e.currentTarget.getBoundingClientRect();mx.set(e.clientX-r.left-r.width/2);my.set(e.clientY-r.top-r.height/2);}}
      onMouseLeave={()=>{mx.set(0);my.set(0);}}
      initial={{opacity:0,y:32}} whileInView={{opacity:1,y:0}} viewport={{once:true}}
      style={{borderColor:'rgba(0,212,255,.12)',boxShadow:'none'}}
      transition={{delay,duration:.6,ease:E}} whileHover={{scale:1.04,borderColor:'var(--cyan)',boxShadow:'var(--glow)'}}>
      <div className="snum mono">{d>0?c.toFixed(d):c}{s}</div>
      <div className="slab">{l}</div>
    </motion.div>
  );
});

/* ─ Error Boundary ─ */
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  render(){
    if(this.state.err){
      return(
        <div style={{position:'fixed',inset:0,background:'#030b18',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:9999,padding:32,fontFamily:"'JetBrains Mono',monospace"}}>
          <div style={{color:'#ff3e6c',fontSize:14,marginBottom:16,letterSpacing:'.1em',textTransform:'uppercase'}}>⚠ Runtime Error</div>
          <div style={{color:'#cce4f0',fontSize:12,maxWidth:600,textAlign:'center',lineHeight:1.8,background:'rgba(255,62,108,.08)',border:'1px solid rgba(255,62,108,.3)',borderRadius:8,padding:20}}>
            {this.state.err.toString()}
          </div>
          <div style={{color:'#5a8aaa',fontSize:11,marginTop:16}}>Open console for full stack trace</div>
        </div>
      );
    }
    return this.props.children;
  }
}

<script>
(function(){
  var C='#00d4ff',G='0 0 14px #00d4ff,0 0 4px rgba(0,212,255,.4)';
  var ring=document.createElement('div');
  ring.style.cssText='position:fixed;top:0;left:0;width:40px;height:40px;border-radius:50%;border:2px solid '+C+';background:transparent;box-shadow:'+G+';pointer-events:none;z-index:2147483647;will-change:transform;transition:box-shadow .2s,border-color .18s,width .18s,height .18s;opacity:0;';
  var dot=document.createElement('div');
  dot.style.cssText='position:fixed;top:0;left:0;width:6px;height:6px;border-radius:50%;background:'+C+';box-shadow:0 0 10px '+C+';pointer-events:none;z-index:2147483647;will-change:transform;opacity:0;';
  var lbl=document.createElement('div');
  lbl.style.cssText='position:fixed;top:0;left:0;font:700 9px/1 "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:'+C+';pointer-events:none;z-index:2147483647;opacity:0;transition:opacity .14s;white-space:nowrap;';
  document.body.appendChild(ring);document.body.appendChild(dot);document.body.appendChild(lbl);
  var mx=window.innerWidth/2,my=window.innerHeight/2,rx=mx,ry=my,sc=1,tsc=1,moved=false;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;if(!moved){moved=true;ring.style.opacity='1';dot.style.opacity='1';}},{passive:true});
  document.addEventListener('mouseover',function(e){
    var t=e.target&&e.target.closest?e.target.closest('a,button,.ptab,.btn,.mi,.ccard,.ctfc,.scard,.plink,.oterm-pill,.copy-btn,.hambtn'):null;
    if(t){tsc=1.55;ring.style.boxShadow='0 0 26px '+C+',0 0 8px rgba(0,212,255,.5)';ring.style.borderColor='rgba(255,255,255,.9)';var txt=(t.dataset&&t.dataset.cursor)||'';lbl.textContent=txt;lbl.style.opacity=txt?'1':'0';}
  },{passive:true});
  document.addEventListener('mouseout',function(e){
    var t=e.target&&e.target.closest?e.target.closest('a,button,.ptab,.btn,.mi,.ccard,.ctfc,.scard,.plink,.oterm-pill,.copy-btn,.hambtn'):null;
    if(t){tsc=1;ring.style.boxShadow=G;ring.style.borderColor=C;lbl.style.opacity='0';}
  },{passive:true});
  document.addEventListener('mousedown',function(){ring.style.transform+=' scale(.85)';},{passive:true});
  document.addEventListener('mouseup',function(){},{passive:true});
  var s=document.createElement('style');s.textContent='*{cursor:none!important}';document.head.appendChild(s);
  (function tick(){
    rx+=(mx-rx)*0.115;ry+=(my-ry)*0.115;sc+=(tsc-sc)*0.14;
    var hw=20*sc;
    ring.style.transform='translate('+(rx-hw)+'px,'+(ry-hw)+'px) scale('+sc+')';
    dot.style.transform='translate('+(mx-3)+'px,'+(my-3)+'px)';
    if(lbl.style.opacity!=='0')lbl.style.transform='translate('+rx+'px,'+(ry+hw+10)+'px) translateX(-50%)';
    requestAnimationFrame(tick);
  })();
})();
</script>
